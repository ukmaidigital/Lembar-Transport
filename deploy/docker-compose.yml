# Production-like stack: nginx → (php-fpm api | next.js web), queue worker, scheduler, MySQL 8, Redis.
# Usage: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: lembar-transport

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  LEMBAR_WEB_URL: ${APP_URL}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  SANCTUM_STATEFUL_DOMAINS: ${APP_HOST}
  LEMBAR_OTP_EXPOSE: "false"
  LEMBAR_ADMIN_2FA_REQUIRED: ${LEMBAR_ADMIN_2FA_REQUIRED:-true}
  LEMBAR_BANK_NAME: ${LEMBAR_BANK_NAME}
  LEMBAR_BANK_NUMBER: ${LEMBAR_BANK_NUMBER}
  LEMBAR_BANK_HOLDER: ${LEMBAR_BANK_HOLDER}
  SEED_DEMO: ${SEED_DEMO:-0}

services:
  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"], interval: 10s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment: *api-env
    volumes: [api-storage:/var/www/api/storage/app]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }

  queue:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment: { <<: *api-env, RUN_MIGRATIONS: "0" }
    volumes: [api-storage:/var/www/api/storage/app]
    depends_on: [api]

  scheduler:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: php artisan schedule:work
    environment: { <<: *api-env, RUN_MIGRATIONS: "0" }
    volumes: [api-storage:/var/www/api/storage/app]
    depends_on: [api]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { NEXT_PUBLIC_API_URL: "${APP_URL}/api/v1" }
    environment:
      API_INTERNAL_URL: http://nginx/api/v1
      SESSION_COOKIE: lt_token
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - api-public:/var/www/api/public:ro
    depends_on: [api, web]

volumes:
  mysql-data:
  redis-data:
  api-storage:
  api-public:
